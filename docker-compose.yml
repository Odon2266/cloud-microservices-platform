

services:
  db:
    image: postgres:15-alpine
    container_name: cloud_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: cloud_platform_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cloud-net

  redis:
    image: redis:7-alpine
    container_name: cloud_redis
    ports:
      - "6379:6379"
    networks:
      - cloud-net

volumes:
  postgres_data:

networks:
  cloud-net:
    driver: bridge